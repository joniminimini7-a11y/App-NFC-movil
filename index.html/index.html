<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar App - Control de Acceso Estudiantil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        .badge {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.35rem;
            color: #1e293b;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        h2 {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .info-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.5;
        }
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .btn-download:hover {
            background-color: #1d4ed8;
        }
        .btn-download:active {
            transform: scale(0.98);
        }
        .version {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo o ícono -->
        <img src="assets/logo.png" alt="Logo Colegio" class="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3064/3064155.png'">

        <span class="badge">Aplicación Oficial</span>

        <h1>Control de Acceso Estudiantil</h1>
        <h2>Unidad Educativa "2 de Agosto"</h2>

        <div class="info-box">
            Presiona el siguiente botón para descargar e instalar directamente la aplicación en tu dispositivo Android.
        </div>

        <!-- 👉 REEMPLAZA EL HREF CON TU ENLACE DIRECTO DEL APK EN GITHUB RELEASES -->
        <a href="https://github.com/tu-usuario/tu-repositorio/releases/download/v1.0.0/app-release.apk" class="btn-download">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Descargar Instalador (APK)
        </a>

        <div class="version">Versión 1.0.0 • Android</div>
    </div>

</body>
</html>
